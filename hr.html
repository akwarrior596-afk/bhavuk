<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR - Hiring & Firing - BK Group</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        button { padding: 5px 10px; margin: 2px; }
    </style>
</head>
<body>
    <h1>HR Dashboard - Hiring & Firing</h1>

    <div class="section">
        <h2>Create Post</h2>
        <form id="createPostForm">
            <input type="text" name="title" placeholder="Post Title" required>
            <textarea name="description" placeholder="Description" required></textarea>
            <input type="text" name="requiredQualifications" placeholder="Required Qualifications" required>
            <input type="number" name="numOpenings" placeholder="Number of openings" min="1" value="1" required>
            <button type="submit">Create Post</button>
        </form>
    </div>

    <div class="section">
        <h2>Applications (Hiring)</h2>
        <div id="applications"></div>
    </div>

    <div class="section">
        <h2>AI Assistant</h2>
        <p>Use AI to assist with role assignment and application decisions.</p>
        <input type="text" id="aiQuery" placeholder="e.g., suggest tasks for available staff" style="width: 70%;" />
        <button id="aiAsk">Ask AI</button>
        <div id="aiResponse" style="margin-top: 10px; padding: 10px; border: 1px solid #aaa; min-height: 60px;">Ask a question to get started.</div>
    </div>

    <script>
        // Password protection
        const password = prompt('Enter admin password:');
        let isFullAdmin = false;
        let isSecondOwner = false;
        if (password === 'admin123') {
            isFullAdmin = true;
        } else if (password === 'owner456') {
            isSecondOwner = true;
        } else {
            alert('Incorrect password');
            window.location.href = '/';
        }

        // Rest of the scripts...
        // Create post
        document.getElementById('createPostForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch('/create-post', { method: 'POST', body: formData })
                .then(res => res.text())
                .then(msg => {
                    alert(msg);
                    this.reset();
                });
        });

        // Load applications
        fetch('/api/applications')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('applications');
                data.forEach(app => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <p><strong>${app.name}</strong> - ${app.email}</p>
                        <p>Role: ${app.role}</p>
                        <p>Qualifications: ${app.qualifications}</p>
                        ${!app.approved ? `<button onclick="approve(${app.id})">Hire</button>` : 'Hired'}
                    `;
                    container.appendChild(div);
                });
            });

        function approve(id) {
            fetch('/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) })
                .then(() => location.reload());
        }

        // Load members
        fetch('/api/members')
            .then(res => res.json())
            .then(data => {
                data.sort((a, b) => a.id - b.id); // Sort by id, first is first owner
                const firstOwnerId = data[0]?.id;
                const container = document.getElementById('members');
                data.forEach(member => {
                    const canFire = isFullAdmin || (isSecondOwner && member.id !== firstOwnerId);
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <p><strong>${member.name}</strong> - ${member.email} - Role: ${member.role || 'N/A'}</p>
                        ${canFire ? `<button onclick="fire(${member.id})">Fire</button>` : ''}
                        <select id="assignPost-${member.id}"></select><button onclick="assignPostToMember(${member.id})">Assign/Change Post</button>
                    `;
                    container.appendChild(div);
                });
                loadPostsForMembers();
            });

        function fire(id) {
            fetch('/fire-member', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ memberId: id }) })
                .then(() => location.reload());
        }

        function loadPostsForMembers() {
            fetch('/api/posts')
                .then(res => res.json())
                .then(posts => {
                    fetch('/api/members')
                        .then(res => res.json())
                        .then(members => {
                            document.querySelectorAll('select[id^="assignPost-"]').forEach(select => {
                                const memberId = select.id.split('-')[1];
                                const member = members.find(m => m.id == memberId);
                                const currentPostId = posts.find(p => p.assignedTo == memberId)?.id;
                                select.innerHTML = '<option value="">Select Post</option>';
                                posts.forEach(post => {
                                    if (!post.filled || post.assignedTo == memberId) {
                                        const option = document.createElement('option');
                                        option.value = post.id;
                                        option.text = post.title;
                                        if (post.id == currentPostId) option.selected = true;
                                        select.appendChild(option);
                                    }
                                });
                            });
                        });
                });
        }

        function assignPostToMember(memberId) {
            const postId = document.getElementById(`assignPost-${memberId}`).value;
            if (!postId) {
                alert('Please select a post');
                return;
            }
            fetch('/assign-post', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId, memberId }) })
                .then(() => location.reload());
        }

        document.getElementById('aiAsk').addEventListener('click', () => {
            const query = document.getElementById('aiQuery').value;
            if (!query.trim()) {
                document.getElementById('aiResponse').innerText = 'Please type a question for AI.';
                return;
            }
            document.getElementById('aiResponse').innerText = 'Thinking...';
            fetch('/ai-advice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            })
            .then(res => res.text())
            .then(advice => {
                document.getElementById('aiResponse').innerText = advice;
            })
            .catch(err => {
                document.getElementById('aiResponse').innerText = 'Error getting advice.';
            });
        });
    </script>
</body>
</html>
