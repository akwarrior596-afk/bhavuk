<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Chat & Suggestion - BK Group</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chat-box, .suggest-box { border: 1px solid #ccc; padding: 15px; margin: 15px 0; }
        .chat-message { border-bottom: 1px solid #e0e0e0; padding: 8px 0; }
        .chat-message:last-child { border-bottom: none; }
        .chat-meta { color: #666; font-size: 0.85rem; }
        input, textarea, select, button { width: 100%; padding: 8px; margin: 8px 0; }
        button { width: auto; }
    </style>
</head>
<body>
    <h1>BK Group - Member Chat & Suggestions</h1>

    <div class="chat-box">
        <h2>Team Chat</h2>
        <div>
            <label for="member">Your Name</label>
            <input id="member" placeholder="Enter your name" />
        </div>
        <div>
            <label for="message">Message</label>
            <textarea id="message" rows="3" placeholder="Write your message"></textarea>
        </div>
        <button id="sendMessage">Send</button>
        <h3>Messages</h3>
        <div id="chatMessages"></div>
    </div>

    <div class="suggest-box">
        <h2>Product Suggestion</h2>
        <form id="suggestForm">
            <label for="suggestion">Suggest Product or Service</label>
            <textarea id="suggestion" name="suggestion" rows="4" required></textarea>
            <label for="type">Type</label>
            <select id="type" name="type" required>
                <option value="product">Product</option>
                <option value="contract">Contract</option>
                <option value="general">General</option>
            </select>
            <button type="submit">Submit Suggestion</button>
        </form>
        <h3>Recent Suggestions</h3>
        <div id="suggestionsList"></div>
    </div>

    <script>
        const chatMessagesElem = document.getElementById('chatMessages');
        const memberInput = document.getElementById('member');
        const messageField = document.getElementById('message');

        function loadChat() {
            fetch('/api/chat')
                .then(res => res.json())
                .then(data => {
                    chatMessagesElem.innerHTML = data.map(m => `
                        <div class="chat-message">
                            <div>${m.message}</div>
                            <div class="chat-meta">${m.member} at ${new Date(m.timestamp).toLocaleString()}</div>
                        </div>
                    `).join('');
                });
        }

        document.getElementById('sendMessage').addEventListener('click', () => {
            const member = memberInput.value.trim();
            const message = messageField.value.trim();
            if (!member || !message) return alert('Enter name and message');

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ member, message })
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                messageField.value = '';
                loadChat();
            });
        });

        function loadSuggestions() {
            fetch('/api/suggestions')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('suggestionsList').innerHTML = data.map(s => `
                        <div style="border-bottom:1px solid #eee;padding:8px 0;">
                            <strong>${s.type}</strong>: ${s.suggestion}
                        </div>
                    `).join('');
                });
        }

        document.getElementById('suggestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const suggestion = document.getElementById('suggestion').value.trim();
            const type = document.getElementById('type').value;
            if (!suggestion) return;

            fetch('/suggest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ suggestion, type })
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                this.reset();
                loadSuggestions();
            });
        });

        // Use polling for near realtime chat updates
        setInterval(loadChat, 3000);
        loadChat();
        loadSuggestions();
    </script>
</body>
</html>
